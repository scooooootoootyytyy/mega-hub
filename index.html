<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEGA HUB</title>
<style>
html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#05060a;
    color:white;
    font-family:Arial,sans-serif;
}
#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05060a;
    font-size:24px;
}
</style>
</head>
<body>

<div id="loading">⚡ Loading MEGA HUB...</div>

<script>
window.addEventListener("error",function(e){
    document.getElementById("loading").innerHTML=
    "<div style='text-align:center;color:#ff6677'>"+
    "<h1>MEGA HUB ERROR</h1>"+
    "<p>"+e.message+"</p>"+
    "<p style='color:#aaa;font-size:14px'>The JavaScript file loaded but encountered an error.</p>"+
    "</div>";
});

window.addEventListener("load",function(){
    setTimeout(function(){
        var l=document.getElementById("loading");
        if(l) l.remove();
    },1000);
});
</script>

<script src="./mega.js"></script>

</body>
</html>
